<svg viewBox="0 0 64 64" role="img" aria-label="Galaxia espiral rodeada de estrellas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nebulosa" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="50" y2="50">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="brillo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <path id="brazo" d="M32 32 A4 4 0 0 0 32 24 A8 8 0 0 0 32 40 A12 12 0 0 0 32 16 A16 16 0 0 0 32 48"
          fill="none" stroke="url(#nebulosa)" stroke-width="2.6" stroke-linecap="round"/>
  </defs>

  <!-- estrellas flotando (colores de tono medio para verse en pestañas claras u oscuras) -->
  <g fill="#a78bfa">
    <circle cx="8" cy="10" r="1.4"/>
    <circle cx="30" cy="4" r="1.2"/>
    <circle cx="57" cy="9" r="1.3" opacity=".8"/>
    <circle cx="56" cy="36" r="1.2"/>
    <circle cx="22" cy="58" r="1.2" opacity=".8"/>
    <circle cx="6" cy="26" r="1.2"/>
    <circle cx="47" cy="49" r=".9" opacity=".8"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="18" cy="5" r="1"/>
    <circle cx="60" cy="22" r=".9"/>
    <circle cx="50" cy="57" r="1.5"/>
    <circle cx="5" cy="42" r="1" opacity=".8"/>
    <circle cx="15" cy="46" r=".8"/>
    <circle cx="36" cy="60" r="1" opacity=".8"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="44" cy="7" r=".9"/>
    <circle cx="10" cy="56" r="1.4"/>
    <circle cx="60" cy="48" r="1"/>
    <circle cx="14" cy="20" r=".8" opacity=".8"/>
    <circle cx="49" cy="22" r=".8"/>
  </g>

  <!-- destellos de cuatro puntas -->
  <path fill="#f59e0b" d="M52 9 Q52 14 57 14 Q52 14 52 19 Q52 14 47 14 Q52 14 52 9Z"/>
  <path fill="#22d3ee" d="M12 44 Q12 48 16 48 Q12 48 12 52 Q12 48 8 48 Q12 48 12 44Z" transform="translate(0 -6)"/>

  <!-- galaxia: dos brazos que se pierden hacia afuera -->
  <use href="#brazo" opacity=".95"/>
  <use href="#brazo" opacity=".7" transform="rotate(180 32 32)"/>

  <!-- núcleo -->
  <circle cx="32" cy="32" r="9" fill="url(#brillo)"/>
  <circle cx="32" cy="32" r="2.6" fill="#fef3c7"/>
</svg>
